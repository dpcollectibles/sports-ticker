<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DP Scoreboard — Live Overlay</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500;700&display=swap');

  :root {
    --bg-dark: #0c0c0c;
    --bg-darker: #000000;
    --red: #c8102e;
    --red-dim: #7a0a1c;
    --white: #f2f2f2;
    --grey: #9a9a9a;
    --mlb: #e0435c;
    --nfl: #6f93d9;
    --nba: #f58426;
    --nhl: #6cace4;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    height: 100%;
    font-family: 'Inter', system-ui, sans-serif;
    display: flex;
    align-items: flex-start;
    justify-content: flex-start;
  }

  .card {
    width: 336px;
    background: linear-gradient(180deg, var(--bg-dark) 0%, var(--bg-darker) 100%);
    border-radius: 10px;
    border-top: 4px solid var(--red);
    box-shadow: 0 6px 18px rgba(0,0,0,0.45);
    box-sizing: border-box;
    padding: 14px 16px 12px;
    transition: border-top-color 0.4s ease;
  }

  .card.mlb { border-top-color: var(--mlb); }
  .card.nfl { border-top-color: var(--nfl); }
  .card.nba { border-top-color: var(--nba); }
  .card.nhl { border-top-color: var(--nhl); }

  .head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .league-tag {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 1px;
    padding: 3px 8px;
    border-radius: 3px;
    color: #0c0c0c;
  }

  .league-tag.mlb { background: var(--mlb); }
  .league-tag.nfl { background: var(--nfl); }
  .league-tag.nba { background: var(--nba); }
  .league-tag.nhl { background: var(--nhl); }

  .status {
    font-family: 'Oswald', sans-serif;
    font-size: 12px;
    letter-spacing: 0.5px;
    color: var(--grey);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .status.live { color: var(--white); }

  .live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--red);
    animation: pulse 1.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
  }

  .matchup {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .team-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .team-left {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .team-logo {
    width: 26px;
    height: 26px;
    object-fit: contain;
    flex-shrink: 0;
  }

  .team-abbr {
    font-family: 'Oswald', sans-serif;
    font-weight: 500;
    font-size: 17px;
    color: var(--white);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .team-score {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 22px;
    color: var(--white);
    min-width: 30px;
    text-align: right;
  }

  .team-score.leading { color: var(--white); }
  .team-score.trailing { color: var(--grey); }

  .empty {
    font-size: 14px;
    color: var(--grey);
    text-align: center;
    padding: 18px 0 6px;
  }

  .dots {
    display: flex;
    justify-content: center;
    gap: 5px;
    margin-top: 12px;
  }

  .dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #3a3a3a;
    transition: background 0.3s ease;
  }

  .dot.active {
    background: var(--red);
  }

  .fade {
    transition: opacity 0.35s ease;
  }

  .fade.hidden {
    opacity: 0;
  }
</style>
</head>
<body>

<div class="card" id="card">
  <div class="head">
    <span class="league-tag" id="leagueTag">---</span>
    <span class="status" id="statusText">Loading…</span>
  </div>
  <div class="matchup fade" id="matchup">
    <div class="empty">Loading scores…</div>
  </div>
  <div class="dots" id="dots"></div>
</div>

<script>
  const LEAGUES = [
    { id: 'mlb', label: 'MLB', cls: 'mlb', url: 'https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/scoreboard' },
    { id: 'nfl', label: 'NFL', cls: 'nfl', url: 'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard' },
    { id: 'nba', label: 'NBA', cls: 'nba', url: 'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard' },
    { id: 'nhl', label: 'NHL', cls: 'nhl', url: 'https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/scoreboard' }
  ];

  const DATA_REFRESH_MS = 60 * 1000;
  const CYCLE_MS = 6 * 1000;

  const card = document.getElementById('card');
  const leagueTag = document.getElementById('leagueTag');
  const statusText = document.getElementById('statusText');
  const matchup = document.getElementById('matchup');
  const dotsWrap = document.getElementById('dots');

  let games = [];
  let idx = 0;

  const stateRank = { in: 0, pre: 1, post: 2 };

  async function fetchLeague(league) {
    try {
      const res = await fetch(league.url, { cache: 'no-store' });
      if (!res.ok) throw new Error('bad status');
      const data = await res.json();
      const events = data.events || [];
      return events.map(ev => normalizeGame(ev, league)).filter(Boolean);
    } catch (err) {
      return [];
    }
  }

  function normalizeGame(ev, league) {
    const comp = ev.competitions && ev.competitions[0];
    if (!comp) return null;
    const competitors = comp.competitors || [];
    const home = competitors.find(c => c.homeAway === 'home');
    const away = competitors.find(c => c.homeAway === 'away');
    if (!home || !away) return null;

    const state = ev.status && ev.status.type ? ev.status.type.state : 'pre';
    let statusStr;
    if (state === 'in') {
      statusStr = (ev.status.type.shortDetail || ev.status.type.detail || 'LIVE').toUpperCase();
    } else if (state === 'post') {
      statusStr = ev.status.type.shortDetail || 'FINAL';
    } else {
      const d = new Date(ev.date);
      statusStr = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    }

    return {
      league,
      state,
      statusStr,
      home: {
        abbr: home.team.abbreviation || home.team.shortDisplayName,
        logo: (home.team.logo || ''),
        score: home.score || '0'
      },
      away: {
        abbr: away.team.abbreviation || away.team.shortDisplayName,
        logo: (away.team.logo || ''),
        score: away.score || '0'
      }
    };
  }

  function sortGames(list) {
    return list.sort((a, b) => (stateRank[a.state] ?? 3) - (stateRank[b.state] ?? 3));
  }

  function renderDots() {
    dotsWrap.innerHTML = '';
    if (games.length <= 1) return;
    games.forEach((_, i) => {
      const d = document.createElement('div');
      d.className = 'dot' + (i === idx ? ' active' : '');
      dotsWrap.appendChild(d);
    });
  }

  function renderGame(g) {
    card.className = 'card ' + g.league.cls;
    leagueTag.className = 'league-tag ' + g.league.cls;
    leagueTag.textContent = g.league.label;

    statusText.className = 'status' + (g.state === 'in' ? ' live' : '');
    statusText.innerHTML = g.state === 'in'
      ? '<span class="live-dot"></span>' + g.statusStr
      : g.statusStr;

    const awayScore = parseInt(g.away.score, 10) || 0;
    const homeScore = parseInt(g.home.score, 10) || 0;
    const hasScore = g.state !== 'pre';

    matchup.innerHTML = `
      <div class="team-row">
        <div class="team-left">
          ${g.away.logo ? `<img class="team-logo" src="${g.away.logo}" onerror="this.style.display='none'">` : ''}
          <span class="team-abbr">${g.away.abbr}</span>
        </div>
        <span class="team-score ${hasScore && awayScore < homeScore ? 'trailing' : ''}">${hasScore ? awayScore : ''}</span>
      </div>
      <div class="team-row">
        <div class="team-left">
          ${g.home.logo ? `<img class="team-logo" src="${g.home.logo}" onerror="this.style.display='none'">` : ''}
          <span class="team-abbr">${g.home.abbr}</span>
        </div>
        <span class="team-score ${hasScore && homeScore < awayScore ? 'trailing' : ''}">${hasScore ? homeScore : ''}</span>
      </div>
    `;

    renderDots();
  }

  function renderEmpty() {
    leagueTag.textContent = '---';
    statusText.className = 'status';
    statusText.textContent = '';
    matchup.innerHTML = '<div class="empty">No games right now</div>';
    dotsWrap.innerHTML = '';
  }

  function showCurrent() {
    if (games.length === 0) {
      renderEmpty();
      return;
    }
    if (idx >= games.length) idx = 0;
    renderGame(games[idx]);
  }

  function cycle() {
    if (games.length <= 1) return;
    matchup.classList.add('hidden');
    setTimeout(() => {
      idx = (idx + 1) % games.length;
      showCurrent();
      matchup.classList.remove('hidden');
    }, 350);
  }

  async function refreshData() {
    const results = await Promise.all(LEAGUES.map(fetchLeague));
    games = sortGames(results.flat());
    if (idx >= games.length) idx = 0;
    showCurrent();
  }

  refreshData();
  setInterval(refreshData, DATA_REFRESH_MS);
  setInterval(cycle, CYCLE_MS);
</script>

</body>
</html>
